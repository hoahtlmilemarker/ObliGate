<div class="st-c"><div class="emx">
<style>
.og .emx{padding:16px clamp(12px,2vw,24px) 32px;display:flex;flex-direction:column;gap:12px;background:var(--pale);min-height:100vh;box-sizing:border-box}
/* prototype-only controls */
.og .emx-pv{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--proto-b);border-radius:4px;background:var(--proto-t);color:var(--proto)}
.og .emx-pv .t{font:700 9.5px/1 Manrope,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:0 4px}
.og .emx-pv .sg{display:inline-flex;gap:2px}
.og .emx-pv button{height:24px;padding:0 9px;border:0;border-radius:3px;background:transparent;font:700 11.5px/1 Manrope,Arial,sans-serif;color:var(--proto);opacity:.75;cursor:pointer}
.og .emx-pv button:hover{opacity:1}
.og .emx-pv button[aria-pressed="true"]{opacity:1;background:var(--proto-on)}
.og .emx-pv .sp{flex:1}
.og .emx-pv .div{width:1px;height:16px;background:var(--proto-b)}
.og .emx-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;padding:12px 14px;border:1px dashed var(--proto-b);border-radius:4px;background:var(--proto-t);color:var(--proto);font-size:12.5px;line-height:1.5}
.og .emx-info b{display:block;font:700 9.5px/1.4 Manrope,Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.og .emx-info[hidden]{display:none}
.og .emx-info code{display:inline-block;font:600 11.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-right:6px}
/* generic mail app */
.og .mc{--m-bg:#F6F8FC;--m-card:#FFFFFF;--m-line:#E3E7EC;--m-ink:#1F2328;--m-gray:#5F6873;--m-sel:#E8EEF7;--m-hov:#F1F3F6;--m-acc:#2F5BD3;--m-chip:#E9ECF0;font-family:Manrope,Arial,sans-serif;color:var(--m-ink);background:var(--m-bg);border:1px solid var(--m-line);border-radius:4px;overflow:hidden;display:grid;grid-template-rows:56px minmax(0,1fr);height:max(720px,calc(100vh - 92px))}
.og .mc[data-mt="dark"]{--m-bg:#16191D;--m-card:#1E2227;--m-line:#2C3238;--m-ink:#E4E7EB;--m-gray:#9AA2AC;--m-sel:#26303B;--m-hov:#23282E;--m-acc:#8AB0FF;--m-chip:#2C3238}
.og .mc svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.og .mc-top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--m-line)}
.og .mc-app{display:flex;align-items:center;gap:8px;width:184px;font:700 16px/1 Manrope,Arial,sans-serif;color:var(--m-ink)}
.og .mc-app svg{width:22px;height:22px;color:var(--m-acc)}
.og .mc-search{flex:1;max-width:620px;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:4px;background:var(--m-chip);color:var(--m-gray);font-size:14px}
.og .mc-me{margin-left:auto;width:32px;height:32px;border-radius:50%;background:#7A5AF8;color:#fff;display:grid;place-items:center;font:700 12.5px/1 Manrope,Arial,sans-serif}
.og .mc-body{display:grid;grid-template-columns:200px 340px minmax(0,1fr);min-height:0}
.og .mc-side{padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.og .mc-compose{display:flex;align-items:center;gap:10px;height:44px;margin:0 0 10px;padding:0 16px;border-radius:4px;background:var(--m-card);border:1px solid var(--m-line);font:700 14px/1 Manrope,Arial,sans-serif;color:var(--m-ink);width:max-content}
.og .mc-f{display:flex;align-items:center;gap:12px;height:34px;padding:0 12px;border-radius:4px;font-size:14px;color:var(--m-ink)}
.og .mc-f.on{background:var(--m-sel);font-weight:700}
.og .mc-f .n{margin-left:auto;font-size:12px;font-weight:700}
.og .mc-list{background:var(--m-card);border-left:1px solid var(--m-line);border-right:1px solid var(--m-line);overflow:auto}
.og .mc-lh{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;border-bottom:1px solid var(--m-line);font:700 15px/1 Manrope,Arial,sans-serif}
.og .mc-lh span{font:500 12px/1 Manrope,Arial,sans-serif;color:var(--m-gray)}
.og .mc-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 10px;width:100%;padding:12px 16px;border-bottom:1px solid var(--m-line);cursor:pointer}
.og .mc-row:hover{background:var(--m-hov)}
.og .mc-row[aria-selected="true"]{background:var(--m-sel)}
.og .mc-row:focus-visible{outline:2px solid var(--m-acc);outline-offset:-2px}
.og .mc-row .a{grid-row:span 3;width:36px;height:36px;border-radius:50%;background:#00365D;color:#fff;display:grid;place-items:center;font:700 14px/1 Manrope,Arial,sans-serif}
.og .mc-row .s{font:700 14px/1.3 Manrope,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.og .mc-row .tm{font:700 12px/1.3 Manrope,Arial,sans-serif;color:var(--m-ink)}
.og .mc-row .sj{grid-column:2/4;font:600 13.5px/1.35 Manrope,Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.og .mc-row .pv{grid-column:2/4;font:400 13px/1.35 Manrope,Arial,sans-serif;color:var(--m-gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.og .mc-row.read .s,.og .mc-row.read .sj,.og .mc-row.read .tm{font-weight:500}
.og .mc-read{background:var(--m-card);overflow:auto;min-width:0}
.og .mc-tb{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:4px;height:44px;padding:0 12px;border-bottom:1px solid var(--m-line);background:var(--m-card);color:var(--m-gray)}
.og .mc-tb i{display:grid;place-items:center;width:34px;height:34px;border-radius:4px}
.og .mc-tb .gap{width:1px;height:18px;background:var(--m-line);margin:0 6px}
.og .mc-tb .pg{margin-left:auto;font-size:12.5px}
.og .mc-msg{padding:20px 24px 28px}
.og .mc-sub{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 18px;font:500 21px/1.3 Manrope,Arial,sans-serif;color:var(--m-ink)}
.og .mc-sub span{font:600 11.5px/1 Manrope,Arial,sans-serif;padding:4px 7px;border-radius:4px;background:var(--m-chip);color:var(--m-gray)}
.og .mc-from{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 12px;align-items:center;margin-bottom:16px}
.og .mc-from .a{grid-row:span 2;width:40px;height:40px;border-radius:50%;background:#00365D;color:#fff;display:grid;place-items:center;font:700 15px/1 Manrope,Arial,sans-serif}
.og .mc-from .n{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.og .mc-from .n b{font-weight:700}
.og .mc-from .n small{font-size:12.5px;color:var(--m-gray)}
.og .mc-from .to{font-size:12.5px;color:var(--m-gray)}
.og .mc-from .tm{grid-row:span 2;font-size:12.5px;color:var(--m-gray);white-space:nowrap}
.og .mc-frame{display:block;width:100%;height:120px;border:0;background:transparent}
.og .mc-txt{margin:0;padding:4px 0;font:400 13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--m-ink);white-space:pre-wrap}
.og .mc-act{display:flex;gap:10px;margin-top:22px}
.og .mc-act span{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--m-line);border-radius:4px;font:600 13.5px/1 Manrope,Arial,sans-serif;color:var(--m-ink)}
/* phone view */
.og .mc.phone{width:390px;max-width:100%;margin:0 auto;grid-template-rows:auto;height:auto;min-height:780px}
.og .mc.phone .mc-top,.og .mc.phone .mc-side,.og .mc.phone .mc-list{display:none}
.og .mc.phone .mc-body{grid-template-columns:minmax(0,1fr)}
.og .mc.phone .mc-tb .gap,.og .mc.phone .mc-tb .pg,.og .mc.phone .mc-tb .dk{display:none}
.og .mc.phone .mc-tb .bk{display:grid}
.og .mc-tb .bk{display:none}
.og .mc.phone .mc-msg{padding:16px 0 24px}
.og .mc.phone .mc-sub,.og .mc.phone .mc-from,.og .mc.phone .mc-act{padding:0 16px}
.og .mc.phone .mc-txt{padding:4px 16px}
@media (max-width:1100px){.og .mc:not(.phone) .mc-body{grid-template-columns:300px minmax(0,1fr)}.og .mc:not(.phone) .mc-side{display:none}.og .mc-app{width:auto}}
@media (max-width:760px){.og .mc:not(.phone) .mc-body{grid-template-columns:minmax(0,1fr)}.og .mc:not(.phone) .mc-list{display:none}.og .mc-search{display:none}}
</style>
<div class="emx-pv" role="group" aria-label="Preview controls">
 <span class="t">Email</span><span class="sg" data-k="i"></span><span class="div"></span>
 <span class="sg" data-k="v"><button type="button" data-val="html">HTML</button><button type="button" data-val="text">Plain text</button></span><span class="div"></span>
 <span class="sg" data-k="w"><button type="button" data-val="desk">Desktop</button><button type="button" data-val="mob">Mobile</button></span><span class="div"></span>
 <span class="sg" data-k="t"><button type="button" data-val="light">Light mail</button><button type="button" data-val="dark">Dark mail</button></span>
 <span class="sp"></span><span class="sg"><button type="button" data-info aria-pressed="false">Template info</button></span>
</div>
<div class="emx-info" hidden></div>
<div class="mc" data-mt="light">
 <div class="mc-top">
  <div class="mc-app"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Mail</div>
  <div class="mc-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search mail</div>
  <div class="mc-me">DO</div>
 </div>
 <div class="mc-body">
  <nav class="mc-side" aria-label="Folders">
   <span class="mc-compose"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Compose</span>
   <span class="mc-f on"><svg viewBox="0 0 24 24"><path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>Inbox<span class="n">3</span></span>
   <span class="mc-f"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>Starred</span>
   <span class="mc-f"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Snoozed</span>
   <span class="mc-f"><svg viewBox="0 0 24 24"><path d="m4 12 16-8-6 16-2-6z"/></svg>Sent</span>
   <span class="mc-f"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg>Drafts</span>
   <span class="mc-f"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></svg>Archive</span>
  </nav>
  <div class="mc-list"><div class="mc-lh">Inbox<span>1–3 of 3</span></div><div class="mc-rows" role="listbox" aria-label="Messages"></div></div>
  <section class="mc-read" aria-label="Message">
   <div class="mc-tb"><i class="bk"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></i><i class="dk"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></i><span class="gap"></span><i><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v11h14V9M10 13h4"/></svg></i><i><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></i><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></i><span class="pg"></span><i><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></i></div>
   <div class="mc-msg">
    <h2 class="mc-sub"></h2>
    <div class="mc-from"><span class="a">O</span><span class="n"><b>ObliGate</b> <small>&lt;no-reply@obligate.example&gt;</small></span><span class="tm"></span><span class="to">to me</span></div>
    <iframe class="mc-frame" title="Email content" sandbox="allow-same-origin"></iframe>
    <pre class="mc-txt" hidden></pre>
    <div class="mc-act"><span><svg viewBox="0 0 24 24"><path d="M10 8 4 13l6 5"/><path d="M4 13h10a6 6 0 0 1 6 6"/></svg>Reply</span><span><svg viewBox="0 0 24 24"><path d="m14 8 6 5-6 5"/><path d="M20 13H10a6 6 0 0 0-6 6"/></svg>Forward</span></div>
   </div>
  </section>
 </div>
</div>
<script type="application/json" id="og-emails"></script>
<script>
(function(){function init(){var root=document.querySelector('.emx');if(!root||root.dataset.on)return;root.dataset.on='1';
 var D=JSON.parse(document.getElementById('og-emails').textContent),E=D.emails,S=D.sample,st={i:0,v:'html',w:'desk',t:'light',info:false};
 var TIME={'verify-email':['9:14 AM','9:14 AM (3 minutes ago)'],'invitation':['9:12 AM','9:12 AM (5 minutes ago)'],'welcome':['9:16 AM','9:16 AM (1 minute ago)']};
 var ORDER=['welcome','verify-email','invitation'],read={};
 var q=function(s){return root.querySelector(s);},mc=q('.mc'),fr=q('.mc-frame'),tx=q('.mc-txt'),rows=q('.mc-rows'),info=q('.emx-info');
 var OPEN=String.fromCharCode(123,123),CLOSE=String.fromCharCode(125,125),RX=new RegExp(OPEN.replace(/./g,'\\$&')+'(\\w+)'+CLOSE.replace(/./g,'\\$&'),'g');
 function fill(s){return s.replace(RX,function(m,k){return S[k]!=null?S[k]:m;});}
 function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
 function idx(id){for(var i=0;i<E.length;i++)if(E[i].id===id)return i;}
 q('.sg[data-k="i"]').innerHTML=E.map(function(e,i){return '<button type="button" data-val="'+i+'">'+esc(e.name)+'</button>';}).join('');
 function fit(){try{var d=fr.contentDocument;if(d&&d.documentElement)fr.style.height=(d.documentElement.scrollHeight)+'px';}catch(x){}}
 function draw(){var e=E[st.i];read[e.id]=1;
  [].forEach.call(root.querySelectorAll('.emx-pv .sg[data-k] button'),function(b){var k=b.parentNode.dataset.k;b.setAttribute('aria-pressed',String(String(st[k])===b.dataset.val));});
  q('[data-info]').setAttribute('aria-pressed',String(st.info));info.hidden=!st.info;
  info.innerHTML='<div><b>When it is sent</b>'+esc(e.trigger)+'</div><div><b>Fields</b>'+e.vars.map(function(v){return '<code>'+v+'</code>';}).join('')+'</div><div><b>Files</b><code>emails/'+e.id+'.html</code><code>emails/'+e.id+'.txt</code></div>';
  mc.dataset.mt=st.t;mc.classList.toggle('phone',st.w==='mob');
  rows.innerHTML=ORDER.map(function(id){var x=E[idx(id)];return '<button type="button" role="option" class="mc-row'+(read[id]?' read':'')+'" aria-selected="'+(x===e)+'" data-id="'+id+'"><span class="a">O</span><span class="s">ObliGate</span><span class="tm">'+TIME[id][0]+'</span><span class="sj">'+esc(fill(x.subject))+'</span><span class="pv">'+esc(fill(x.preheader))+'</span></button>';}).join('');
  q('.mc-sub').innerHTML=esc(fill(e.subject))+' <span>Inbox</span>';
  q('.mc-from .tm').textContent=TIME[e.id][1];q('.mc-tb .pg').textContent=(ORDER.indexOf(e.id)+1)+' of 3';
  tx.hidden=st.v!=='text';fr.hidden=st.v==='text';tx.textContent=fill(e.text).replace(/^Subject:.*\n\n/,'');
  var h=fill(e.html);if(st.t==='dark'){var m=h.match(/<style data-dark>\s*@media \(prefers-color-scheme: dark\)\{([\s\S]*?)\}\s*<\/style>/);if(m)h=h.replace('</head>','<style>'+m[1]+'</style></head>');}
  fr.style.height='120px';fr.onload=function(){fit();setTimeout(fit,300);};fr.srcdoc=h;}
 q('.emx-pv').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;if(b.hasAttribute('data-info')){st.info=!st.info;draw();return;}var k=b.parentNode.dataset.k;if(!k)return;st[k]=k==='i'?+b.dataset.val:b.dataset.val;draw();});
 rows.addEventListener('click',function(ev){var b=ev.target.closest('.mc-row');if(b){st.i=idx(b.dataset.id);draw();}});
 rows.addEventListener('keydown',function(ev){if(ev.key!=='ArrowDown'&&ev.key!=='ArrowUp')return;ev.preventDefault();var o=ORDER.indexOf(E[st.i].id)+(ev.key==='ArrowDown'?1:-1);if(o<0||o>2)return;st.i=idx(ORDER[o]);draw();rows.querySelector('[aria-selected="true"]').focus();});
 addEventListener('resize',fit);
 draw();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
</div></div>

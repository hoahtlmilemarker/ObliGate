<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ObliGate</title>
    <style>
      /* Brand loader on app load (removed by <BootLoaderDone/> once React has mounted). */
      #og-boot{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#FFFFFF;transition:opacity .45s ease,visibility .45s}
      #og-boot.dk{background:#0E151D}
      #og-boot.out{opacity:0;visibility:hidden}
      #og-boot .mk{width:64px;height:64px;color:#0B3A66}#og-boot.dk .mk{color:#E2C27E}
      #og-boot img{width:150px;height:auto;opacity:0;transform:translateY(6px);animation:ogIn .6s .05s cubic-bezier(.2,.7,.2,1) forwards}
      #og-boot.dk img{filter:brightness(0) invert(1)}
      #og-boot .tk{position:relative;width:132px;height:2px;border-radius:2px;background:rgba(36,64,116,.12);overflow:hidden}
      #og-boot.dk .tk{background:rgba(255,255,255,.12)}
      #og-boot .tk i{position:absolute;top:0;left:0;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#C9A45C,#E2C27E);animation:ogBar 1.1s cubic-bezier(.65,0,.35,1) infinite}
      #og-boot .cap{font:600 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#6B7480;opacity:0;animation:ogIn .6s .2s ease forwards}
      #og-boot.dk .cap{color:#8A97A6}
      #og-boot .o,#og-boot .i,#og-boot .c{transform-box:view-box;transform-origin:24px 24px}
      #og-boot .o{animation:ogsO 1.6s cubic-bezier(.55,.1,.45,.9) infinite}
      #og-boot .i{animation:ogsI 1.1s cubic-bezier(.55,.1,.45,.9) infinite}
      #og-boot .c{animation:ogsC 1.6s ease-in-out infinite}
      @keyframes ogsO{to{transform:rotate(360deg)}}@keyframes ogsI{to{transform:rotate(-360deg)}}
      @keyframes ogsC{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.72) rotate(45deg)}}
      @keyframes ogIn{to{opacity:1;transform:none}}@keyframes ogBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#og-boot *{animation:none!important;opacity:1!important;transform:none!important}}
    </style>
  </head>
  <body>
    <div id="og-boot" role="status" aria-label="Loading">
      <div class="mk">
        <svg viewBox="0 0 48 48" width="64" height="64" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.2" opacity=".1" />
          <g class="o"><path d="M 24 6 A 18 18 0 1 1 6 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55" /></g>
          <g class="i"><path d="M 36 24 A 12 12 0 1 1 24 12" stroke="#C9A45C" stroke-width="1.7" stroke-linecap="round" /></g>
          <rect class="c" x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor" />
        </svg>
      </div>
      <img src="/obligate-wordmark.svg" alt="ObliGate" />
      <div class="tk"><i></i></div>
      <div class="cap">Loading workspace</div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('og-boot');
        el.dataset.t = String(performance.now());
        // Shown on every full load / reload of the app; in-app navigation uses the page skeleton instead.
        try { if (localStorage.getItem('og-theme') === 'dark') el.className = 'dk'; } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
